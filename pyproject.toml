[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "ai-updates"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# build.py embeds HTML/CSS templates as single-line strings; wrapping them hurts readability.
"scripts/build.py" = ["E501"]
