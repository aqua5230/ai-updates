[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# build.py embeds HTML/CSS templates as single-line strings; wrapping them hurts readability.
"scripts/build.py" = ["E501"]
