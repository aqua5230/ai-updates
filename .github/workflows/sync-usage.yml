name: Sync usage compatibility feed

on:
  push:
    branches: [main]
    paths: [ai_updates.json]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Disabled since 2026-10-16: aqua5230/usage keeps its last synced copy for
    # apps older than 0.27. `gh workflow enable sync-usage.yml` resumes it.
    concurrency:
      group: usage-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ai-updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aqua5230/usage
          ref: main
          token: ${{ secrets.USAGE_SYNC_TOKEN }}
          path: usage
      - name: Copy and push the compatibility feed
        run: |
          cp ai-updates/ai_updates.json usage/ai_updates.json
          cd usage
          if git diff --quiet -- ai_updates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_updates.json
          git commit -m "chore: sync AI updates"
          git push origin HEAD:main
