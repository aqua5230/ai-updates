name: Daily update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "data/curated/**"
      - "scripts/build.py"
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The usage compatibility feed has two writers: the sync step below and
    # sync-usage.yml. A local curation push matches both workflows' path
    # filters, so without this they race on the same aqua5230/usage HEAD and
    # the loser fails on non-fast-forward, or wins with a stale checkout.
    concurrency:
      group: usage-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch official updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/fetch.py | tee /tmp/ai-updates-new.txt
      - name: Verify build outputs
        run: |
          pip install "pytest>=9,<10" "ruff>=0.16,<0.17"
          ruff check scripts tests
          pytest -q
      - name: Build feeds
        run: python3 scripts/build.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Assign first: under bash -e a failed substitution aborts the step,
          # whereas inlining it would silently stage data/raw with no feeds.
          outputs=$(python3 -c 'from scripts.build import BUILD_OUTPUTS; print(" ".join(BUILD_OUTPUTS))')
          git add -- data/raw $outputs
          # Decide from what is actually staged: an unrelated dirty file must not
          # make this step attempt an empty commit and fail.
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update AI changelogs"
          git push origin HEAD:main
      - name: Check out usage compatibility target
        uses: actions/checkout@v4
        with:
          repository: aqua5230/usage
          ref: main
          token: ${{ secrets.USAGE_SYNC_TOKEN }}
          path: usage-sync
      - name: Sync usage compatibility feed
        run: |
          cp ai_updates.json usage-sync/ai_updates.json
          cd usage-sync
          if git diff --quiet -- ai_updates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_updates.json
          git commit -m "chore: sync AI updates"
          git push origin HEAD:main
      - name: Open review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r marker tool_id version; do
            [ "$marker" = "NEW" ] || continue
            # Version-only prereleases do not need human curation.
            if python3 -c 'import json,sys; from pathlib import Path; from scripts.build import is_placeholder; p=Path("data/raw")/sys.argv[1]/f"{sys.argv[2]}.json"; d=json.loads(p.read_text()); raise SystemExit(0 if is_placeholder(d, sys.argv[2]) else 1)' "$tool_id" "$version"; then
              continue
            fi
            case "$tool_id" in
              claude_code) tool_name="Claude Code" ;;
              codex) tool_name="Codex" ;;
              agy) tool_name="Antigravity" ;;
              usage) tool_name="Usage" ;;
              gh_cli) tool_name="GitHub CLI" ;;
              *)
                echo "::warning::Unknown tool id '${tool_id}'; using it as the display name." >&2
                tool_name="$tool_id"
                ;;
            esac
            issue_title="Review ${tool_name} ${version}"
            if gh issue list --state all --limit 1000 --json title --jq '.[].title' \
              | grep -Fqx -- "$issue_title"; then
              continue
            fi
            gh issue create \
              --title "$issue_title" \
              --body "A new official ${tool_name} ${version} changelog was imported. Rewrite and review data/curated/${tool_id}/${version}.json, then merge it to main."
          done < /tmp/ai-updates-new.txt
