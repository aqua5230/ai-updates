name: Daily update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "data/curated/**"
      - "scripts/build.py"
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Dates on the site follow Taiwan time, same as the local curation runs.
    env:
      TZ: Asia/Taipei
    # A scheduled run and a curation push can start together; run them one at
    # a time so they don't race on this repo's main.
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch official updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # One unreachable source must not hold back the other tools; the last step still fails the run.
          if ! python3 scripts/fetch.py | tee /tmp/ai-updates-new.txt; then
            echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
          fi
      - name: Verify build outputs
        run: |
          pip install "pytest>=9,<10" "ruff>=0.16,<0.17"
          ruff check scripts tests
          pytest -q
      - name: Build feeds
        run: python3 scripts/build.py
      - name: Commit changed data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Assign first: under bash -e a failed substitution aborts the step,
          # whereas inlining it would silently stage data/raw with no feeds.
          outputs=$(python3 -c 'from scripts.build import BUILD_OUTPUTS; print(" ".join(BUILD_OUTPUTS))')
          git add -- data/raw $outputs
          # Decide from what is actually staged: an unrelated dirty file must not
          # make this step attempt an empty commit and fail.
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update AI changelogs"
          if ! git push origin HEAD:main; then
            # A local curation run pushed first. Its commit also rewrote the
            # generated feeds, so rebuild on top of it once instead of rebasing.
            git fetch origin main
            git reset --hard origin/main
            set -o pipefail
            if ! python3 scripts/fetch.py | tee /tmp/ai-updates-new.txt; then
              echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
            fi
            python3 scripts/build.py
            git add -- data/raw $outputs
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: update AI changelogs"
            git push origin HEAD:main
          fi
      - name: Open review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r marker tool_id version; do
            [ "$marker" = "NEW" ] || continue
            # Version-only prereleases do not need human curation.
            if python3 -c 'import json,sys; from pathlib import Path; from scripts.build import is_placeholder; p=Path("data/raw")/sys.argv[1]/f"{sys.argv[2]}.json"; d=json.loads(p.read_text()); raise SystemExit(0 if is_placeholder(d, sys.argv[2]) else 1)' "$tool_id" "$version"; then
              continue
            fi
            case "$tool_id" in
              claude_code) tool_name="Claude Code" ;;
              codex) tool_name="Codex" ;;
              agy) tool_name="Antigravity" ;;
              grok_build) tool_name="Grok Build" ;;
              muse_code) tool_name="Muse Code" ;;
              usage) tool_name="Usage" ;;
              gh_cli) tool_name="GitHub CLI" ;;
              *)
                echo "::warning::Unknown tool id '${tool_id}'; using it as the display name." >&2
                tool_name="$tool_id"
                ;;
            esac
            issue_title="Review ${tool_name} ${version}"
            if gh issue list --state all --limit 1000 --json title --jq '.[].title' \
              | grep -Fqx -- "$issue_title"; then
              continue
            fi
            gh issue create \
              --title "$issue_title" \
              --body "A new official ${tool_name} ${version} changelog was imported. Rewrite and review data/curated/${tool_id}/${version}.json, then merge it to main."
          done < /tmp/ai-updates-new.txt
      - name: Report fetch failures
        if: env.FETCH_FAILED == '1'
        run: |
          echo "::error::Some official changelogs could not be fetched; see the Fetch official updates step."
          exit 1
