    function shareButtons(tool,version,small=false){const controls=el("div",`share-controls${small?" share-controls-small":""}`),details=shareDetails(tool,version),open=(url)=>window.open(url,"_blank","noopener");const add=(name,label,action)=>{const button=el("button",`share-button icon-${name}`);button.type="button";button.setAttribute("aria-label",label);button.append(icon(name));button.addEventListener("click",event=>{event.stopPropagation();action()});controls.append(button)};add("x",shareLabel("X"),()=>open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(details.text)}&url=${encodeURIComponent(details.url)}`));add("threads",shareLabel("Threads"),()=>open(`https://www.threads.net/intent/post?text=${encodeURIComponent(`${details.text}\n${details.url}`)}`));add("facebook",shareLabel("Facebook"),()=>open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(details.url)}`));add("copy",COPY[language].copyLink,()=>{const copied=()=>{const status=el("span","copy-status",COPY[language].copied);controls.append(status);setTimeout(()=>status.remove(),1500)};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(details.url).then(copied).catch(()=>window.prompt("",details.url));else window.prompt("",details.url)});if(navigator.share)add("system",COPY[language].share,()=>navigator.share(details).catch(()=>{}));return controls}
    function positionTabSlider(tabs){const slider=tabs.querySelector(".section-tab-slider"),activeBtn=tabs.querySelector(".section-tab-btn.active");if(slider&&activeBtn){slider.style.width=`${activeBtn.offsetWidth}px`;slider.style.transform=`translateX(${activeBtn.offsetLeft}px)`}}
    function renderContent(){const container=document.getElementById("active-tool-display"),tool=data.tools.find(item=>item.id===currentToolId);if(!tool||!tool.latest){container.replaceChildren(el("p","status-message",COPY[language].empty));return}const t=COPY[language],latest=latestVersion(tool),latestData=versionItems(latest),versions=historyVersions(tool),existingTabs=container.querySelector(".section-tabs");let tabs;if(existingTabs){tabs=existingTabs;const btns=tabs.querySelectorAll(".section-tab-btn");[["latest",t.tabLatest],["history",t.tabHistory]].forEach(([section,label],i)=>{const btn=btns[i];if(btn){btn.textContent=label;const isActive=activeSection===section;btn.className=`section-tab-btn${isActive?" active":""}`;btn.setAttribute("aria-pressed",String(isActive))}});while(container.lastChild&&container.lastChild!==tabs)container.lastChild.remove()}else{container.replaceChildren();tabs=el("div","section-tabs");const slider=el("div","section-tab-slider");tabs.append(slider);[["latest",t.tabLatest],["history",t.tabHistory]].forEach(([section,label])=>{const button=el("button",`section-tab-btn${activeSection===section?" active":""}`,label);button.type="button";button.setAttribute("aria-pressed",String(activeSection===section));button.addEventListener("click",()=>{activeSection=section;render()});tabs.append(button)});container.append(tabs)}positionTabSlider(tabs);if(activeSection==="latest"){const tagline=el("div","version-tagline");tagline.append(el("span","version-num",`VERSION ${latest.version}`),el("span","latest-indicator",t.latest),el("span","version-period",(latest.curated||latest.raw||{}).period||""),versionActions(tool,latest));container.append(tagline,filterChips());const timeline=el("div","timeline-container");latestData.items.filter(item=>itemMatchesFilter(item,latestData.curated)).forEach(item=>timeline.append(itemView(item,latestData.curated)));container.append(timeline);return}container.append(filterChips());const history=el("div","history-list");if(loadingTools.has(tool.id))history.append(el("p","status-message",t.loading));if(!versions.length)history.append(el("p","status-message",t.empty));versions.forEach(version=>history.append(historyCard(tool,version)));container.append(history)}
    function historyCard(tool,version){const open=expanded.has(version.version),card=el("section",`history-accordion-card${open?" expanded":""}`);card.id=`history-${version.version}`;const row=el("div","history-accordion-header-row"),header=el("button","history-accordion-header");header.type="button";header.setAttribute("aria-expanded",String(open));const label=el("span","history-ver-title");label.append(el("span","history-arrow","▶"),el("span","",`Version ${version.version}`));header.append(label,el("span","version-period",(version.curated||version.raw||{}).period||version.period||""));header.addEventListener("click",()=>{if(expanded.has(version.version)){expanded.delete(version.version);setHash(tool.id);render()}else{expanded.add(version.version);setHash(tool.id,version.version);refreshAfterHistory(tool.id);render()}});row.append(header,versionActions(tool,version,true));card.append(row);if(open){const body=el("div","history-accordion-body");const content=versionItems(version);if(loadingTools.has(tool.id)&&!version.curated&&!version.raw)body.append(el("p","status-message",COPY[language].loading));else content.items.filter(item=>itemMatchesFilter(item,content.curated)).forEach(item=>body.append(itemView(item,content.curated,true)));card.append(body)}return card}
    setupLanguage();
    setupSidebarControls();
    window.addEventListener("hashchange",()=>{if(data)applyHash(true)});
    window.addEventListener("resize",()=>{const tabs=document.querySelector(".section-tabs");if(tabs)positionTabSlider(tabs)});
    fetch("data.json").then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(payload=>{data=payload;applyHash(true)}).catch(showLoadError);
