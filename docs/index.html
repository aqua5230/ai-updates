      const menuInner=el("div","share-menu-inner");menu.append(menuInner);menu.id=`share-${tool.id}-${version.version}`;menu.hidden=true;menu.setAttribute("role","group");menu.setAttribute("aria-label",t.shareOn);button.setAttribute("aria-controls",menu.id);
      copyButton.addEventListener("click",event=>{event.stopPropagation();copyWithFeedback(copyButton,details.url,()=>COPY[language].copyLink)});
      const expand=()=>{closeShareMenu();if(!button.isConnected)return;menu.hidden=false;menu.style.left=menu.style.right="";if(menu.getBoundingClientRect().left<0){menu.style.left="0";menu.style.right="auto"}button.setAttribute("aria-expanded","true");activeShareMenu={button,menu};menu.querySelector("button").focus()};
      button.addEventListener("click",async event=>{event.stopPropagation();if(!menu.hidden){closeShareMenu();return}closeShareMenu();if(navigator.share){try{await navigator.share(shareDetails(tool,resolvedVersion(tool,version)));return}catch(error){if(error?.name==="AbortError")return}}expand()});
      const platforms=[

        [t.shareThreads,d=>`https://www.threads.net/intent/post?text=${encodeURIComponent(`${d.text}\n${d.url}`)}`],

        [t.shareX,d=>`https://twitter.com/intent/tweet?text=${encodeURIComponent(d.text)}&url=${encodeURIComponent(d.url)}`]

      platforms.forEach(([label,url])=>{const item=el("button","markdown-copy-btn",label);item.type="button";item.setAttribute("aria-label",shareLabel(label));item.addEventListener("click",event=>{event.stopPropagation();open(url(shareDetails(tool,resolvedVersion(tool,version))));closeShareMenu(true)});menuInner.append(item)});

    function positionTabSlider(tabs){const slider=tabs.querySelector(".section-tab-slider"),activeBtn=tabs.querySelector(".section-tab-btn.active");if(slider&&activeBtn){slider.style.width=`${activeBtn.offsetWidth}px`;slider.style.transform=`translateX(${activeBtn.offsetLeft}px)`}}

    function renderContent(){closeShareMenu();const container=document.getElementById("active-tool-display"),tool=data.tools.find(item=>item.id===currentToolId);if(!tool||!tool.latest){container.replaceChildren(el("p","status-message",COPY[language].empty));return}const t=COPY[language],latest=latestVersion(tool),latestData=versionItems(latest,tool),versions=historyVersions(tool),existingTabs=container.querySelector(".section-tabs");let tabs;if(existingTabs){tabs=existingTabs;const btns=tabs.querySelectorAll(".section-tab-btn");[["latest",t.tabLatest],["history",t.tabHistory]].forEach(([section,label],i)=>{const btn=btns[i];if(btn){btn.textContent=label;const isActive=activeSection===section;btn.className=`section-tab-btn${isActive?" active":""}`;btn.setAttribute("aria-pressed",String(isActive))}});while(container.lastChild&&container.lastChild!==tabs)container.lastChild.remove()}else{container.replaceChildren();tabs=el("div","section-tabs");const slider=el("div","section-tab-slider");tabs.append(slider);[["latest",t.tabLatest],["history",t.tabHistory]].forEach(([section,label])=>{const button=el("button",`section-tab-btn${activeSection===section?" active":""}`,label);button.type="button";button.setAttribute("aria-pressed",String(activeSection===section));button.addEventListener("click",()=>{activeSection=section;invalidHashNotice=false;render()});tabs.append(button)});container.append(tabs)}positionTabSlider(tabs);if(activeSection==="latest"){if(invalidHashNotice){const notice=el("p","status-message",t.invalidHash);notice.setAttribute("role","status");container.append(notice)}const tagline=el("div","version-tagline"),meta=el("div","version-meta");meta.append(el("h2","version-num",`${latest.version}`),el("span","latest-indicator",t.latest),el("span","version-period",(latest.curated||latest.raw||{}).period||""));tagline.append(meta,versionActions(tool,latest));container.append(tagline,filterChips(latestData));const timeline=el("div","timeline-container"),items=filter     function historyCard(tool,version){const open=expanded.has(version.version),card=el("section",`history-accordion-card${open?" expanded":""}`);card.id=`history-${version.version}`;const row=el("div","history-accordion-header-row"),header=el("button","history-accordion-header");header.type="button";header.setAttribute("aria-expanded",String(open));const label=el("span","history-ver-title");label.append(el("span","history-arrow","▸"),el("span","",version.version));header.append(label,el("span","version-period",(version.curated||version.raw||{}).period||version.period||""));header.addEventListener("click",()=>{invalidHashNotice=false;if(expanded.has(version.version)){expanded.delete(version.version);setHash(tool.id);render()}else{expanded.add(version.version);setHash(tool.id,version.version);requestHistoryForView(tool,version.version);render()}});row.append(header,versionActions(tool,version,true));card.append(row);if(open){const body=el("div","history-accordion-body"),content=versionItems(version,tool),items=filteredItems(content),key=historyKey(tool.id,historyPage(tool,version.version));if(historyErrors.has(key))body.append(historyErrorState(tool,version.version));else if(historyRequests.has(key)&&!version.curated&&!version.raw)body.append(el("p","status-message",COPY[language].loading));else if((activeFilters.size||hideEnterprise)&&items.length===0)body.append(filterEmptyState());else items.forEach(item=>body.append(itemView(item,content.curated,true)));card.append(body)}return card}
